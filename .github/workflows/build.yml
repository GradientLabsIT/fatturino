name: Build and Push

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, gd, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env || true

      - name: Generate app key
        run: php artisan key:generate

      - name: Create dummy Vite manifest
        run: |
          mkdir -p public/build/assets
          touch public/build/assets/app.css
          touch public/build/assets/app.js
          cat > public/build/manifest.json << 'EOF'
          {
              "resources/css/app.css": {"file": "assets/app.css", "src": "resources/css/app.css"},
              "resources/js/app.js": {"file": "assets/app.js", "src": "resources/js/app.js"}
          }
          EOF

      - name: Run tests
        run: composer test

      - name: Lint (Pint)
        run: vendor/bin/pint --test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          tags: fatturino:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/fatturino
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose build fatturino
          docker compose up -d --force-recreate fatturino

          for attempt in $(seq 1 30); do
              status=$(docker inspect fatturino --format '{{.State.Health.Status}}' 2>/dev/null || true)
              if [ "$status" = healthy ]; then
                  curl --fail --silent --show-error http://127.0.0.1:8095/up >/dev/null
                  exit 0
              fi
              sleep 2
          done

          docker logs --tail 100 fatturino
          exit 1
          REMOTE
